# OpenProject 插件 bundle：向 profile 插入一条 Host 插件行。
#
# 注意：下面的 name 必须是**已发布的包名** —— Loader 就是按这个 specifier 去导入插件的。
# 因为以 @ 开头，YAML 里必须加引号。
#
# 本文件刻意不放任何具体部署信息。插件不预设实例地址，使用方需自行配置（任选其一）：
#   1) 环境变量 OPENPROJECT_BASE_URL / OPENPROJECT_API_TOKEN（推荐，跨机器最省事）
#   2) 在本 profile 的 cordis.patch.yml 里追加一条同名 id 的行覆盖 config
#
# Token 默认依次从 config.token → config.tokenFile → DSH 凭据服务 → 环境变量读取；
# tokenFile 默认推导为 $DSH_HOME/openproject.token，因此换电脑无需改任何文件。
#
# 覆盖示例（profile 补丁层优先级高于 bundle 层，且 config 是整体替换而非深合并，
# 所以要把需要保留的字段一并写全）：
#
#   - id: openproject
#     name: "@liu_zhao_feng_alex/dsh-plugin-openproject"
#     config:
#       baseUrl: 'https://your-openproject.example.com'
#       rejectUnauthorized: true
#       readOnly: false
#
# 多实例（同一个 profile 同时接入多个 OpenProject）：再追加一条 insert，用不同的 id
# 和不同的 toolPrefix，例如：
#
#   - insert:
#       - id: openproject-secknow
#         name: "@liu_zhao_feng_alex/dsh-plugin-openproject"
#         config:
#           label: '速知启智'
#           toolPrefix: 'secknow_'
#           baseUrl: 'https://openproject.secknow-ai.com'
#
# toolPrefix 决定工具名（lab_ + openproject_list_projects → lab_list_projects），
# label 会进入系统提示词与工具描述。详见 README「方式 D：同时接入多个实例」。
#
- insert:
    - id: openproject
      name: "@liu_zhao_feng_alex/dsh-plugin-openproject"
